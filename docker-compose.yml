version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: luminicent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - luminicent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminicent-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGIN=http://localhost:5173
      - GITHUB_CALLBACK_URL=http://localhost:5000/api/github/callback
      - GITHUB_REDIRECT_URI=http://localhost:5000/api/github/callback
      - REDIS_URL=redis://redis:6379
      - LUMINICENT_LOCAL_ONLY=true
      - LUMINICENT_COMPOSE_LOCAL_ONLY=true
      - LUMINICENT_EXECUTION_MODE=disabled
      - LUMINICENT_BUILD_NETWORK=none
      - SESSION_SECURE=false
      - SESSION_SAME_SITE=lax
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminicent-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: luminicent-network

volumes:
  luminicent-redis-data:
